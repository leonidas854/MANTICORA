org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# El codigo fuente vive en una particion NTFS/FUSE: la compilacion incremental
# de Kotlin deja instantaneas de classpath que Gradle no siempre puede releer
# ahi, y aborta con "Failed to create MD5 hash". Se desactiva a proposito.
kotlin.incremental=false
# 'build/' es un enlace a ext4 y el proyecto esta en FUSE: la vigilancia del
# sistema de ficheros de Gradle no ve bien esas rutas y declara inexistentes
# ficheros que si estan. Se desactiva.
org.gradle.vfs.watch=false
org.gradle.caching=true
org.gradle.parallel=true
